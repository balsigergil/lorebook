services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lorebook}
      POSTGRES_USER: ${DB_USER:-lorebook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lorebook}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${EMAIL_PORT:-1025}:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
