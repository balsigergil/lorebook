{% load allauth %}
<div class="field{% if attrs.errors %} field-danger{% endif %}">
  {% if attrs.type == "checkbox" %}
    <div class="field-switch">
      <input type="checkbox" class="switch" role="switch"
             {% if attrs.required %}required{% endif %}
             {% if attrs.checked %}checked{% endif %}
             {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
             {% if attrs.id %}id="{{ attrs.id }}"{% endif %}>
      <label class="input-check-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
    </div>
  {% else %}
    <label class="label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
    {% if attrs.type == "textarea" %}
      <textarea class="input" {% if attrs.required %}required{% endif %}
                {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
                {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
                {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
                {% if attrs.readonly %}readonly{% endif %}
                {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
    {% else %}
      <input class="input" type="{{ attrs.type }}"
             {% if attrs.required %}required{% endif %}
             {% if attrs.disabled %}disabled{% endif %}
             {% if attrs.readonly %}readonly{% endif %}
             {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
             {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
             {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
             {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
             {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}>
    {% endif %}
  {% endif %}
  {% if slots.help_text %}<p class="field-text-help">{% slot help_text %}{% endslot %}</p>{% endif %}
  {% for error in attrs.errors %}<p class="field-text-danger">{{ error }}</p>{% endfor %}
</div>
