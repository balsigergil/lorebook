{% load vite i18n %}<!DOCTYPE html>
{% get_current_language as ui_lang %}
<html lang="{% block html_lang %}{{ ui_lang }}{% endblock %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"defaultSettleDelay": 0}'>
  <title>{% block title %}{{ site.site_name }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  {% vite "assets/js/app.ts" %}
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% if messages %}
  <script type="application/json" id="lorebook-messages">[{% for message in messages %}{"level": "{{ message.tags|escapejs }}", "text": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]</script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
