{% load i18n %}{% if not translation %}<span class="status status-missing" title="{% translate 'Not written yet' %}">{{ code|upper }}</span>{% elif translation.status == "outdated" %}<span class="status status-outdated" title="{% translate 'Outdated' %}">{{ code|upper }}</span>{% elif translation.status == "draft" %}<span class="status status-draft" title="{% translate 'Draft, never published' %}">{{ code|upper }}</span>{% else %}<span class="status status-published{% if translation.has_draft_changes %} status-changed{% endif %}" title="{% if translation.has_draft_changes %}{% translate 'Published, with unpublished changes' %}{% else %}{% translate 'Published and up to date' %}{% endif %}">{{ code|upper }}</span>{% endif %}
