{% extends "editor/layout.html" %}
{% load i18n %}
{% block page_title %}{% translate "Glossary" %}{% endblock %}
{% block content %}
<div class="page page-narrow">
  <header class="page-header"><h1 class="page-title">{% translate "Edit a term" %}</h1></header>
  <div class="card"><div class="card-body">{% include "core/forms/htmx_form.html" %}</div></div>
  <form method="post" class="mt-4">
    {% csrf_token %}
    <input type="hidden" name="delete" value="1">
    <button type="submit" class="btn btn-ghost btn-sm text-danger"><i class="fa-solid fa-trash"></i> {% translate "Delete this term" %}</button>
  </form>
</div>
{% endblock %}
