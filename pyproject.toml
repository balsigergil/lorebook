[project]
name = "lorebook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django-allauth[socialaccount]>=65.19.7",
    "django-ninja>=1.7.1",
    "django-storages>=1.14.6",
    "django-tasks-db>=0.13.0",
    "django[argon2]>=6.1.2",
    "granian>=2.8.4",
    "markdown-it-py>=4.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lorebook.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:allauth.*", "ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["S101", "S311", "DJ001", "S308", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
